name: apply-core-rebuild-payload

on:
  push:
    branches:
      - agent/core-brightening-rebuild

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/core-brightening-rebuild
      - name: Apply source update
        shell: bash
        run: |
          cat .github/core-payload/part* | base64 -d > /tmp/core-rebuild-update.tar.gz
          echo "6f976c6ad113758f0dde9bf2997c37b3e26d035a5b9a03cc045e5deee9e0da7a  /tmp/core-rebuild-update.tar.gz" | sha256sum -c -
          tar -xzf /tmp/core-rebuild-update.tar.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "rebuild proof-oriented type and extern recovery"
          git push origin HEAD:agent/core-brightening-rebuild
