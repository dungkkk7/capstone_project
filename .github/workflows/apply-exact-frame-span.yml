name: apply-exact-frame-span

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/core-brightening-rebuild
      - name: Replace compatibility-sized frame with the proven exact span
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/llvm_pass/brighten_040_stack_frame_pass/src/RuleCompactPostStateFrame.cpp')
          text = path.read_text()
          old = '    int64_t FrameSize = std::max<int64_t>(Max - Min + 16384, 65536);\n'
          new = (
              '    // The complete-use proof above establishes that every observable\\n'
              '    // byte lies in [Min, Max).  Retaining a 64 KiB guest-stack cushion\\n'
              '    // after that proof only preserves lifted representation noise and\\n'
              '    // prevents downstream SROA/type recovery.  Materialize exactly the\\n'
              '    // proven native object span; unsupported/escaping accesses were\\n'
              '    // already refused before this transaction.\\n'
              '    int64_t FrameSize = Max - Min;\\n'
          ).replace('\\n', '\n')
          if old not in text:
              raise SystemExit('expected compatibility-sized frame allocation not found')
          path.write_text(text.replace(old, new))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/llvm_pass/brighten_040_stack_frame_pass/src/RuleCompactPostStateFrame.cpp
          git diff --cached --quiet && exit 0
          git commit -m "fix(stack-frame): allocate the exact proven frame span"
          git push origin HEAD:agent/core-brightening-rebuild
