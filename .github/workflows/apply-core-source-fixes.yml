name: apply-core-source-fixes

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/core-brightening-rebuild
      - name: Apply compile fixes without changing algorithms
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/llvm_pass/brighten_080_type_reconstruction/PointerOffsetAnalysis.cpp')
          text = path.read_text()
          old = 'for (Use &Use : Val->uses()) {\n    User *U = Use.getUser();'
          new = 'for (Use &PointerUse : Val->uses()) {\n    User *U = PointerUse.getUser();'
          if old not in text and new not in text:
              raise SystemExit('expected pointer-use loop not found')
          path.write_text(text.replace(old, new))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/llvm_pass/brighten_080_type_reconstruction/PointerOffsetAnalysis.cpp
          git diff --cached --quiet && exit 0
          git commit -m "fix(type-reconstruct): avoid llvm Use name shadowing"
          git push origin HEAD:agent/core-brightening-rebuild
