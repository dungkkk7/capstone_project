name: export-premerge-source

on:
  push:
    branches:
      - agent/tmp-premerge-source-export
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: tar --exclude=.git --exclude=dependency --exclude=result --exclude=reports -czf premerge-source.tar.gz src tests tools configs docs README.md
      - uses: actions/upload-artifact@v4
        with:
          name: premerge-source
          path: premerge-source.tar.gz
          retention-days: 1
